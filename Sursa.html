<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSA Signup - 1024 Bit</title>

    <link rel="stylesheet" href="sursa.css">

    <!-- JSEncrypt -->
    <script src="https://cdn.jsdelivr.net/npm/jsencrypt/bin/jsencrypt.min.js"></script>
</head>

<body>

<div class="container">
    <h1>RSA Signup</h1>
    <p class="subtitle">1024-bit Encryption and Decryption</p>

    <form id="signupForm">

        <label>Full Name</label>
        <input type="text" id="fullname" placeholder="Enter your full name" required>

        <label>Date of Birth</label>
        <input type="date" id="dob" required>

        <label>Year Level</label>
        <select id="yearlevel" required>
            <option value="">Select Year Level</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>

        <label>Gender</label>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>

        <button type="submit">Encrypt & Decrypt</button>
    </form>

    <div class="result">
        <h2>RSA Result - 1024 Bit</h2>

        <label>Original Data</label>
        <textarea id="original" readonly></textarea>

        <label>Encrypted Data</label>
        <textarea id="encrypted" readonly></textarea>

        <label>Decrypted Data</label>
        <textarea id="decrypted" readonly></textarea>
    </div>
</div>

<script src="sursa.js"></script>

<script>
    setupRSA(1024);
</script>

</body>
</html>
